<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FLOW · Piano ferie · Chat post formazione · v6</title>
  <style>
    :root{
      --green:#075e54;
      --green2:#128c7e;
      --green3:#25d366;
      --chat-bg:#efe7dd;
      --bubble:#ffffff;
      --bubble-me:#dcf8c6;
      --ink:#17212b;
      --muted:#667085;
      --line:#e4e7ec;
      --soft:#f7faf9;
      --cream:#fff8e6;
      --cream-line:#ffdf9a;
      --danger:#d72638;
      --ok:#087443;
      --warn:#9a5b00;
      --shadow:0 26px 70px rgba(0,0,0,.28);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left, rgba(37,211,102,.25), transparent 31rem),
        radial-gradient(circle at bottom right, rgba(255,248,230,.20), transparent 34rem),
        linear-gradient(135deg,#053d35 0%,#075e54 48%,#0b2f2a 100%);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      min-height:100vh;
      min-height:100dvh;
      overflow:hidden;
    }
    .app{
      width:min(100%, 900px);
      height:min(96vh, 1120px);
      height:min(96dvh, 1120px);
      border-radius:32px;
      overflow:hidden;
      box-shadow:var(--shadow);
      background:var(--chat-bg);
      border:8px solid rgba(255,255,255,.14);
      display:flex;
      flex-direction:column;
      position:relative;
    }
    header{
      background:linear-gradient(90deg,var(--green),var(--green2));
      color:#fff;
      padding:16px 18px 14px;
      display:grid;
      grid-template-columns:50px 1fr auto;
      gap:12px;
      align-items:center;
    }
    .avatar{
      width:48px;height:48px;border-radius:50%;
      display:grid;place-items:center;
      background:#d9fdd3;
      color:var(--green);
      font-weight:1000;
      letter-spacing:.02em;
    }
    .head-title{font-weight:950;font-size:18px;line-height:1.1}
    .head-sub{font-size:12px;opacity:.86;margin-top:3px}
    .progress-label{
      border:1px solid rgba(255,255,255,.28);
      background:rgba(255,255,255,.12);
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .progress-wrap{grid-column:1/-1;height:7px;background:rgba(255,255,255,.24);border-radius:999px;overflow:hidden;margin-top:7px}
    .progress{height:100%;width:0%;background:var(--green3);border-radius:999px;transition:width .35s ease}
    .chat{
      flex:1 1 auto;
      min-height:0;
      overflow-y:auto;
      padding:18px 18px 20px;
      background:
        linear-gradient(rgba(239,231,221,.93), rgba(239,231,221,.93)),
        repeating-linear-gradient(45deg, transparent 0 18px, rgba(7,94,84,.035) 18px 19px);
      scroll-behavior:smooth;
    }
    .row{display:flex;margin:9px 0}
    .row.me{justify-content:flex-end}
    .bubble{
      max-width:min(86%, 720px);
      background:var(--bubble);
      border-radius:var(--radius);
      padding:13px 14px;
      box-shadow:0 1px 3px rgba(0,0,0,.10);
      font-size:16px;
      line-height:1.42;
    }
    .row.me .bubble{background:var(--bubble-me)}
    .bubble p{margin:0 0 8px}
    .bubble p:last-child{margin-bottom:0}
    .bubble ul,.bubble ol{margin:8px 0 0 21px;padding:0}
    .bubble li{margin:5px 0}
    .mini-title{
      display:block;
      color:var(--green);
      font-size:12px;
      font-weight:950;
      letter-spacing:.06em;
      text-transform:uppercase;
      margin-bottom:6px;
    }
    .stamp{display:block;text-align:right;font-size:10px;color:#7c8a86;margin-top:7px;user-select:none}
    .req{color:var(--danger);font-weight:1000}
    .tag{
      display:inline-flex;align-items:center;gap:5px;
      border-radius:999px;
      border:1px solid #ffc4cb;
      background:#fff1f3;
      color:#991b1b;
      font-size:12px;
      font-weight:950;
      padding:3px 8px;
      margin:2px 4px 4px 0;
    }
    .card{
      margin-top:9px;
      padding:11px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
    }
    .card.soft{background:var(--soft)}
    .card.must{border-color:#ffc4cb;background:linear-gradient(180deg,#fff8f9,#fff)}
    .note{
      margin-top:8px;
      border:1px solid var(--cream-line);
      background:var(--cream);
      border-radius:15px;
      padding:10px 11px;
      font-size:14px;
    }
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:9px}
    .chip-card{
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:10px;
      font-weight:800;
      font-size:14px;
    }
    .checkline{
      display:flex;gap:10px;align-items:flex-start;
      padding:10px;
      margin:7px 0;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      font-size:14px;
    }
    .checkline input{accent-color:var(--green);width:18px;height:18px;margin-top:1px;flex:0 0 auto}
    .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
    label.form-field{display:block;font-weight:850;font-size:13px}
    input,select,textarea{
      width:100%;
      border:1px solid #d0d5dd;
      border-radius:14px;
      padding:12px;
      font:inherit;
      background:#fff;
      color:var(--ink);
      outline:none;
      min-height:48px;
    }
    textarea{min-height:92px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 4px rgba(18,140,126,.13)}
    .inline-btn{
      border:0;
      border-radius:14px;
      padding:12px 14px;
      min-height:48px;
      background:var(--green);
      color:#fff;
      font-weight:950;
      width:100%;
      margin-top:10px;
      cursor:pointer;
    }
    .inline-btn.secondary{background:#f2f7f5;color:var(--green);border:1px solid #d6e8e2}
    .result{
      margin-top:10px;
      border:1px solid #c8eadc;
      background:#f0fff6;
      border-radius:14px;
      padding:10px;
      font-size:14px;
    }
    .result.warn{border-color:#ffd79b;background:#fff8eb;color:#633d00}
    .result.bad{border-color:#ffc4cb;background:#fff1f3;color:#7f1d1d}
    .typing{display:inline-flex;gap:4px;align-items:center;min-width:50px;justify-content:center}
    .typing span{width:7px;height:7px;border-radius:50%;background:#8c8c8c;animation:bounce 1s infinite ease-in-out}
    .typing span:nth-child(2){animation-delay:.12s}.typing span:nth-child(3){animation-delay:.24s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
    .options{
      position:static;
      flex:0 0 auto;
      padding:12px 16px calc(16px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg,rgba(239,231,221,.94),rgba(239,231,221,1));
      display:flex;
      gap:9px;
      flex-wrap:wrap;
      justify-content:flex-end;
      border-top:1px solid rgba(7,94,84,.10);
    }
    button{font:inherit}
    .reply{
      min-height:48px;
      border:1px solid rgba(7,94,84,.15);
      border-radius:999px;
      background:#fff;
      color:var(--green);
      padding:11px 16px;
      font-weight:900;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      cursor:pointer;
      transition:transform .16s ease, background .16s ease;
      white-space:normal;
      line-height:1.2;
      text-align:center;
    }
    .reply:hover{transform:translateY(-1px);background:#f5fffb}
    .reply.primary{background:var(--green);color:#fff}
    .reply.good{background:#e8fff0;color:var(--ok)}
    .reply.warn{background:#fff7e6;color:var(--warn)}
    .reply:disabled{opacity:.55;cursor:not-allowed;transform:none}
    details{border:1px solid var(--line);border-radius:15px;padding:10px 11px;background:#fff;margin:8px 0}
    summary{cursor:pointer;font-weight:950;color:var(--green)}
    details p{margin:8px 0 0;color:#344054;font-size:14px}
    .mini-score{font-size:12px;color:var(--muted);margin-top:8px}
    .memo-text{
      width:100%;
      min-height:260px;
      margin-top:10px;
      font-family:inherit;
      line-height:1.42;
      font-size:14px;
      white-space:pre-wrap;
    }
    .memo-actions{grid-template-columns:repeat(2,minmax(0,1fr));}
    .muted{color:var(--muted)}
    .hidden{display:none!important}
    @media (max-width:720px){
      body{padding:0;align-items:stretch}
      .app{height:100vh;height:100dvh;width:100%;border:0;border-radius:0}
      header{grid-template-columns:48px 1fr;padding:14px 14px 12px}
      .progress-label{display:none}
      .chat{padding:14px 12px 14px}
      .bubble{max-width:96%;font-size:15px;border-radius:18px}
      .grid,.form-grid,.memo-actions{grid-template-columns:1fr}
      .options{justify-content:center;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
      .reply{flex:1 1 100%;width:100%;border-radius:18px;min-height:52px;padding:12px 14px}
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Chat interattiva Piano ferie annuale">
    <header>
      <div class="avatar">PF</div>
      <div>
        <div class="head-title">FLOW · Piano ferie annuale</div>
        <div class="head-sub">chat post formazione · strumento operativo</div>
      </div>
      <div class="progress-label" id="progressLabel">0%</div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    </header>
    <section class="chat" id="chat" aria-live="polite"></section>
    <nav class="options" id="options" aria-label="Risposte rapide"></nav>
  </main>

  <script>
    const chat = document.querySelector('#chat');
    const options = document.querySelector('#options');
    const progress = document.querySelector('#progress');
    const progressLabel = document.querySelector('#progressLabel');

    const state = {
      goal:'', role:'', month:'', monthNote:'',
      mandatoryCount:0, toolScore:null, ruleScore:null, scenarioScore:0,
      calc:null, conflictChoice:'', teamMessage:'', governanceCount:0
    };

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const now = () => new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
    const stamp = () => `<span class="stamp">${now()}</span>`;

    const monthInfo = {
      febbraio:{label:'Febbraio', season:'FEB-APR', message:'Mese utile per alleggerire accumuli, se la base supera il budget. Controlla residui, budget e settimane disponibili.', risk:'medio'},
      marzo:{label:'Marzo', season:'FEB-APR', message:'Buon mese per pianificare 1/2 settimane, tenendo conto di Pasqua se cade nel periodo.', risk:'medio'},
      aprile:{label:'Aprile', season:'FEB-APR', message:'Periodo da leggere con attenzione per Pasqua, ponti e traffico commerciale.', risk:'medio'},
      maggio:{label:'Maggio', season:'MAG-SET', message:'Inizio fascia estesa: verifica anticipo, rotazione e sostenibilità delle richieste.', risk:'medio'},
      giugno:{label:'Giugno', season:'MAG-SET', message:'Mese ad alta intensità: due settimane consecutive garantite nel piano, ma scarico da calibrare con budget e operative.', risk:'alto'},
      luglio:{label:'Luglio', season:'MAG-SET', message:'Periodo centrale: attenzione a saldi, coperture chiave e rotazione equa.', risk:'alto'},
      agosto:{label:'Agosto', season:'MAG-SET', message:'Mese molto sensibile: presidia ruoli, cassa, apertura/chiusura e richieste sovrapposte.', risk:'alto'},
      settembre:{label:'Settembre', season:'MAG-SET', message:'Ultimo mese della finestra giugno-settembre: verifica che le due settimane consecutive siano state garantite nel piano.', risk:'alto'},
      ottobre:{label:'Ottobre', season:'OTT-GEN', message:'Rientro operativo: valuta riequilibrio, residui e preparazione alle settimane commerciali successive.', risk:'medio'},
      novembre:{label:'Novembre', season:'OTT-GEN', message:'Mese da presidiare per Black Friday e operative intense. Scarico ferie più prudente nelle settimane sensibili.', risk:'alto'},
      dicembre:{label:'Dicembre', season:'OTT-GEN', message:'Natale e picchi commerciali: copertura, ruoli e flessibilità vanno controllati con precisione.', risk:'alto'},
      gennaio:{label:'Gennaio', season:'OTT-GEN', message:'Chiusura anno commerciale: controlla residui, saldi e pianificazione dell’anno successivo.', risk:'medio'}
    };

    const steps = {
      intro:{
        progress:0,
        messages:[
          `<span class="mini-title">Dopo la formazione</span><p>Questa chat ti aiuta a trasformare le slide in azioni concrete.</p><p>Non devi studiare tutto da capo: rispondi, scegli, controlla e alla fine scarichi un promemoria.</p>`,
          `<div class="note"><strong>Regola di lettura:</strong> quando trovi <span class="req">*</span>, quell’informazione o azione è obbligatoria.</div>`
        ],
        options:[{label:'Inizia dal check 1', next:'goal', primary:true}]
      },
      goal:{
        progress:5,
        messages:[
          `<span class="mini-title">Check 1 · Obiettivo</span><p>Cosa devi fare adesso con il piano ferie?</p>`
        ],
        options:[
          {label:'Creo la prima bozza', next:'role', set:{goal:'Creare la prima bozza'}, primary:true},
          {label:'Controllo un piano già fatto', next:'role', set:{goal:'Controllare un piano già fatto'}},
          {label:'Capisco un mese critico', next:'role', set:{goal:'Capire un mese critico'}}
        ]
      },
      role:{
        progress:10,
        messages:[
          `<span class="mini-title">Check 2 · Ruolo</span><p>Con quale prospettiva stai usando lo strumento?</p>`
        ],
        options:[
          {label:'Store Manager', next:'value', set:{role:'Store Manager'}, primary:true},
          {label:'Assistant Manager', next:'value', set:{role:'Assistant Manager'}},
          {label:'HR / RRHH', next:'value', set:{role:'HR / RRHH'}},
          {label:'Altro ruolo', next:'value', set:{role:'Altro ruolo'}}
        ]
      },
      value:{
        progress:16,
        messages:[
          `<span class="mini-title">Check 3 · Valore delle ferie</span><p>Prima parte umana: le ferie non sono solo vuoto in calendario.</p><p>Sono tempo tutelato, recupero, vita privata e rientro più lucido.</p>`,
          `<strong>Mini quiz:</strong> quale frase useresti per spiegare il senso del piano ferie?`
        ],
        options:[
          {label:'Tiene insieme persone e store', next:'firstAction', feedback:'Esatto. Il piano ferie è una mappa di equilibrio: ascolto delle persone + continuità operativa.', good:true, primary:true},
          {label:'Serve solo a coprire assenze', next:'firstAction', feedback:'È una parte del tema, ma non basta. Il piano ferie serve anche a rendere il tempo progettato, equo e leggibile.', warn:true},
          {label:'È un adempimento HR', next:'firstAction', feedback:'Non solo. La formazione lo presenta come progetto di equilibrio, non come semplice adempimento.', warn:true}
        ]
      },
      firstAction:{
        progress:23,
        messages:[
          `<span class="mini-title">Check 4 · Cosa fai per primo?</span><p>Qui si decide se il piano nasce ordinato oppure no.</p><p><strong>Qual è la prima azione concreta?</strong></p>`
        ],
        options:[
          {label:'Chiedo subito le preferenze al team', next:'mandatoryData', feedback:'Meglio di no: prima devi costruire la bozza e capire il perimetro sostenibile.', warn:true},
          {label:'Apro file HR e preparo la bozza', next:'mandatoryData', feedback:'Corretto. Si parte dal file ricevuto e da una base di lavoro completa.', good:true, primary:true},
          {label:'Faccio firmare i moduli', next:'mandatoryData', feedback:'Quello arriva dopo la convalida del piano. Prima bozza, dati, calcoli e verifica.', warn:true}
        ]
      },
      mandatoryData:{
        progress:30,
        messages:[
          `<span class="mini-title">Check 5 · Bozza</span><p>Segna cosa hai già nella bozza. Non serve essere perfetti ora: serve capire cosa manca.</p>`,
          `<div class="card must js-mandatory-box">
            <span class="tag"><span class="req">*</span> dati obbligatori</span>
            <label class="checkline"><input type="checkbox" value="Nome e cognome"> Nome e cognome</label>
            <label class="checkline"><input type="checkbox" value="Codice dipendente"> Codice dipendente</label>
            <label class="checkline"><input type="checkbox" value="Ruolo"> Ruolo</label>
            <label class="checkline"><input type="checkbox" value="Base oraria"> Base oraria</label>
            <label class="checkline"><input type="checkbox" value="Settimane ferie/ROL"> Settimane ferie/ROL da pianificare, incluse ore residue</label>
            <label class="checkline"><input type="checkbox" value="Weekend"> Weekend scelti, dove previsto</label>
            <button class="inline-btn js-mandatory">Conferma check bozza</button>
            <div class="js-mandatory-result"></div>
          </div>`
        ],
        after:'mandatory'
      },
      tools:{
        progress:39,
        messages:[
          `<span class="mini-title">Check 6 · Strumenti</span><p>Abbina lo strumento al bisogno. È una verifica veloce per capire se hai recuperato i documenti giusti.</p>`,
          `<div class="card js-tools-box">
            <label class="form-field">Saldo ferie/ROL individuale <span class="req">*</span>
              <select data-answer="File residuo H ferie/ROL"><option value="">Scegli</option><option>File piano ferie</option><option>File residuo H ferie/ROL</option><option>Modulo richiesta ferie/ROL</option><option>Modello disponibilità</option></select>
            </label>
            <label class="form-field">Calcolo maturazione ferie/ROL <span class="req">*</span>
              <select data-answer="Tabelle maturazione"><option value="">Scegli</option><option>Tabelle maturazione</option><option>Modulo richiesta ferie/ROL</option><option>Calendario commerciale</option><option>DT e HR</option></select>
            </label>
            <label class="form-field">Richiesta firmata dopo convalida <span class="req">*</span>
              <select data-answer="Modulo richiesta ferie/ROL"><option value="">Scegli</option><option>File residuo H ferie/ROL</option><option>Contratto CIA</option><option>Modulo richiesta ferie/ROL</option><option>Budget ore</option></select>
            </label>
            <label class="form-field">Disponibilità ad aumento ore temporaneo
              <select data-answer="Modello disponibilità"><option value="">Scegli</option><option>Modello disponibilità</option><option>File piano ferie</option><option>Training INET</option><option>Calendario commerciale</option></select>
            </label>
            <button class="inline-btn js-tools">Verifica strumenti</button>
            <div class="js-tools-result"></div>
          </div>`
        ],
        after:'tools'
      },
      rules:{
        progress:48,
        messages:[
          `<span class="mini-title">Check 7 · Paletti</span><p>Adesso controlliamo le regole che non possono sparire dal piano.</p>`,
          `<div class="card must">
            <ul>
              <li><span class="req">*</span> Periodo commerciale: <strong>febbraio → gennaio</strong>.</li>
              <li><span class="req">*</span> Due piani distinti: venditori e manager.</li>
              <li><span class="req">*</span> Nessuna sovrapposizione tra figure responsabili.</li>
              <li><span class="req">*</span> Da giugno a settembre: due settimane consecutive garantite nel piano.</li>
              <li><span class="req">*</span> Copertura cassa, apertura/chiusura e competenze chiave.</li>
              <li><span class="req">*</span> Rotazione/equità: se manca accordo, si guarda l’anno precedente e poi si procede secondo indicazioni.</li>
            </ul>
          </div>`,
          `<strong>Mini quiz:</strong> se due responsabili chiedono lo stesso periodo, cosa controlli subito?`
        ],
        options:[
          {label:'Se il negozio regge comunque', next:'month', feedback:'Controllo utile, ma manca il paletto principale: no sovrapposizione tra figure responsabili.', warn:true},
          {label:'Che non ci sia sovrapposizione', next:'month', feedback:'Esatto: la sovrapposizione tra responsabili è un blocco da evitare.', good:true, primary:true},
          {label:'Chi ha chiesto prima', next:'month', feedback:'Non basta. Prima viene la sostenibilità del piano e la regola sulle figure responsabili.', warn:true}
        ]
      },
      month:{
        progress:56,
        messages:[
          `<span class="mini-title">Check 8 · Mese critico</span><p>Scegli un mese: la chat ti dice cosa attenzionare prima di fare il calcolo.</p>`,
          `<div class="card js-month-box">
            <label class="form-field">Mese da controllare <span class="req">*</span>
              <select class="js-month-select">
                <option value="">Scegli un mese</option>
                <option value="febbraio">Febbraio</option><option value="marzo">Marzo</option><option value="aprile">Aprile</option><option value="maggio">Maggio</option><option value="giugno">Giugno</option><option value="luglio">Luglio</option><option value="agosto">Agosto</option><option value="settembre">Settembre</option><option value="ottobre">Ottobre</option><option value="novembre">Novembre</option><option value="dicembre">Dicembre</option><option value="gennaio">Gennaio</option>
              </select>
            </label>
            <button class="inline-btn js-month">Leggi mese</button>
            <div class="js-month-result"></div>
          </div>`
        ],
        after:'month'
      },
      calc:{
        progress:66,
        messages:[
          `<span class="mini-title">Check 9 · Base incomprimibile</span><p>Ora il pezzo più pratico: quante ore fisse hai e cosa succede rispetto al budget?</p>`,
          `<div class="note"><strong>Formula:</strong> base incomprimibile settimanale × settimane del mese = base incomprimibile mese.</div>`,
          `<div class="card js-calc-box">
            <div class="form-grid">
              <label class="form-field">Base incomprimibile settimanale <span class="req">*</span><input type="number" min="0" step="0.1" inputmode="decimal" data-field="base" placeholder="es. 300"></label>
              <label class="form-field">Settimane del mese <span class="req">*</span><input type="number" min="0" step="0.1" inputmode="decimal" data-field="weeks" placeholder="es. 4 o 4.2"></label>
              <label class="form-field">Budget ore mese <span class="req">*</span><input type="number" min="0" step="0.1" inputmode="decimal" data-field="budget" placeholder="es. 1000"></label>
            </div>
            <button class="inline-btn js-calc">Calcola suggerimento</button>
            <div class="js-calc-result"></div>
          </div>`
        ],
        after:'calc'
      },
      scenarios:{
        progress:74,
        messages:[

          {label:'Preferenze entro data + paletti', next:'conflict', feedback:'Perfetto. Le preferenze vanno raccolte dentro un perimetro già spiegato: scadenza, settimane sensibili, limiti e criteri.', good:true, primary:true, set:{teamMessage:'Entro la data indicata inviate le preferenze ferie/ROL, tenendo conto dei paletti condivisi: settimane sensibili, sostenibilità, rotazione ed equilibrio del team.'}},
          {label:'Decido io e poi vi dico', next:'conflict', feedback:'Meglio evitare: il piano va costruito in accordo con lo staff, conciliando richieste e esigenze del negozio.', warn:true, set:{teamMessage:'Da migliorare: serve accordo con lo staff, non solo decisione unilaterale.'}}
        ]
      },
      conflict:{
        progress:89,

          `<span class="mini-title">Check 12 · Richieste sovrapposte</span><p>Due persone chiedono lo stesso periodo sensibile. Nessun accordo immediato.</p><p>Come ti muovi?</p>`
        ],
        options:[

          {label:'Approvo chi ha scritto prima', next:'governance', feedback:'Non basta: il criterio non è solo la velocità della richiesta, ma equità e sostenibilità.', warn:true, set:{conflictChoice:'Da rivedere: non usare solo ordine di arrivo.'}},
          {label:'Nego a entrambe le persone', next:'governance', feedback:'Troppo rigido: prima va cercata una mediazione sostenibile.', warn:true, set:{conflictChoice:'Da rivedere: serve mediazione prima del no.'}}

      },
      governance:{

        messages:[
          `<span class="mini-title">Check 13 · Chiusura e governance</span><p>Ultimo controllo: il piano diventa ufficiale solo se resta tracciabile.</p>`,

        after:'governance'
      },
      summary:{

            <p><strong>Ruolo:</strong> ${state.role || 'non indicato'}</p>
            <p><strong>Mese controllato:</strong> ${state.month || 'non indicato'}</p>
            <p><strong>Calcolo:</strong> ${state.calc ? state.calc.summary : 'non ancora compilato'}</p>
            <p><strong>Scenario:</strong> ${state.scenarioScore}/2 risposte corrette.</p>
            <p><strong>Governance:</strong> ${state.governanceCount}/6 controlli selezionati.</p>
          </div>`,
          `<div class="card js-final-box">
            <strong>Azioni consigliate ora</strong>

              <li>Completa la bozza con tutti i campi <span class="req">*</span>.</li>
              <li>Controlla residui, tabelle, calendario commerciale e indicazioni aziendali.</li>

              <li>Comunica al team paletti e scadenza prima di raccogliere preferenze.</li>
              <li>Chiudi il file ufficiale, invia a HR/DT, affiggi, fai firmare e archivia.</li>
            </ol>
            <button class="inline-btn js-open-memo">Apri promemoria</button>
            <button class="inline-btn secondary js-copy-memo">Copia promemoria</button>
            <button class="inline-btn secondary js-copy-team">Copia messaggio al team</button>
            <div class="js-final-result"></div>
          </div>`
        ],
        after:'final',
        options:[{label:'Apri glossario', next:'glossary', primary:true},{label:'Rivedi il calcolo', next:'calc'}]
      },
      glossary:{
        progress:100,
        messages:[
          `<span class="mini-title">Glossario operativo</span>
          <details open><summary>Ferie</summary><p>Tempo annuale retribuito e irrinunciabile. Nel piano viene gestito anche in ore.</p></details>
          <details><summary>ROL</summary><p>Permessi retribuiti, più flessibili, utili per esigenze personali e organizzative.</p></details>
          <details><summary>Piano ferie</summary><p>Mappa che mette in equilibrio preferenze del team e continuità operativa dello store.</p></details>
          <details><summary>Base incomprimibile</summary><p>Somma delle basi contrattuali fisse presenti in store. Serve per capire la copertura fissa mese per mese.</p></details>
          <details><summary>Budget ore</summary><p>Monte ore assegnato al negozio. Va confrontato con la base incomprimibile per capire gap e azioni.</p></details>
          <details><summary>Scarico ferie/ROL</summary><p>Ore pianificate in ferie o ROL per alleggerire la base, senza scoprire momenti sensibili.</p></details>
          <details><summary>Settimane sensibili</summary><p>Periodi da presidiare: saldi, Natale, Pasqua, Black Friday, ponti, allestimenti, inventari e operative intense.</p></details>
          <details><summary>CIA</summary><p>Contratto Integrativo Aziendale: riferimento integrativo su ferie, ROL, weekend e festivi.</p></details>
          <details><summary>Governance</summary><p>Regole per tenere il piano vivo: modifiche approvate, file sempre aggiornato, moduli archiviati e reminder tracciati.</p></details>`
        ],
        options:[{label:'Ricomincia', next:'intro'},{label:'Rivedi promemoria', next:'summary', primary:true}]
      }
    };

    let busy = false;

    function setProgress(value){
      progress.style.width = value + '%';
      progressLabel.textContent = value + '%';
    }
    function clearOptions(){ options.innerHTML = ''; }
    function addMessage(html, who='bot'){
      const row = document.createElement('div');
      row.className = 'row' + (who === 'me' ? ' me' : '');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = html + stamp();
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }
    async function addBot(html, delay=420){
      const row = addMessage('<span class="typing"><span></span><span></span><span></span></span>');
      await sleep(delay);
      const content = typeof html === 'function' ? html() : html;
      row.querySelector('.bubble').innerHTML = content + stamp();
      chat.scrollTop = chat.scrollHeight;
    }
    function addUser(text){ addMessage(text, 'me'); }

    function showOptions(items=[]){
      clearOptions();
      items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'reply' + (item.primary ? ' primary' : '') + (item.good ? ' good' : '') + (item.warn ? ' warn' : '');
        btn.textContent = item.label;
        btn.addEventListener('click', () => handleOption(item));
        options.appendChild(btn);
      });
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    async function goTo(id){
      const step = steps[id];
      if(!step) return;
      busy = true;
      clearOptions();
      setProgress(step.progress || 0);
      for(const msg of step.messages){
        await addBot(msg);
        await sleep(100);
      }
      if(step.after) runAfter(step.after);
      if(step.options) showOptions(step.options);
      busy = false;
    }

    async function handleOption(item){
      if(busy) return;
      addUser(item.label);
      clearOptions();
      if(item.set) Object.assign(state, item.set);
      if(item.addScenario) state.scenarioScore += item.addScenario;
      if(item.feedback) await addBot(item.feedback);
      if(item.next){ await sleep(150); goTo(item.next); }
    }

    function runAfter(type){
      if(type === 'mandatory') bindMandatory();
      if(type === 'tools') bindTools();
      if(type === 'month') bindMonth();
      if(type === 'calc') bindCalc();
      if(type === 'governance') bindGovernance();
      if(type === 'final') bindFinal();
    }

    function bindMandatory(){
      document.querySelectorAll('.js-mandatory:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', async () => {
          const box = btn.closest('.js-mandatory-box');
          const checked = [...box.querySelectorAll('input:checked')].map(x => x.value);
          state.mandatoryCount = checked.length;
          const out = box.querySelector('.js-mandatory-result');
          if(checked.length === 6){
            out.innerHTML = `<div class="result"><strong>Perfetto:</strong> la bozza ha tutti i dati obbligatori.</div>`;
          } else {
            out.innerHTML = `<div class="result warn"><strong>Ti mancano ${6 - checked.length} dati.</strong> Puoi proseguire, ma prima di chiedere preferenze al team dovrai completarli.</div>`;
          }
          await addBot(checked.length === 6 ? 'Ottimo: bozza pronta per il passaggio strumenti.' : 'Va bene: abbiamo individuato cosa manca. Ora recuperiamo gli strumenti giusti.');
          showOptions([{label:'Vai agli strumenti', next:'tools', primary:true}]);
        });
      });
    }

    function bindTools(){
      document.querySelectorAll('.js-tools:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', async () => {
          const box = btn.closest('.js-tools-box');
          const selects = [...box.querySelectorAll('select')];
          let score = 0;
          selects.forEach(sel => { if(sel.value === sel.dataset.answer) score++; });
          state.toolScore = score;
          const out = box.querySelector('.js-tools-result');
          out.innerHTML = `<div class="result ${score < 3 ? 'warn' : ''}"><strong>${score}/4 abbinamenti corretti.</strong> ${score === 4 ? 'Hai gli strumenti chiave sotto controllo.' : 'Rivedi gli strumenti prima di chiudere la bozza.'}</div>`;
          await addBot(score === 4 ? 'Bene: ora passiamo ai paletti che rendono il piano sostenibile.' : 'Non serve bloccarci: proseguiamo, ma tieni gli strumenti da rivedere nel promemoria.');
          showOptions([{label:'Vai ai paletti', next:'rules', primary:true}]);
        });
      });
    }

    function bindMonth(){
      document.querySelectorAll('.js-month:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', async () => {
          const box = btn.closest('.js-month-box');
          const select = box.querySelector('.js-month-select');
          const out = box.querySelector('.js-month-result');
          if(!select.value){
            out.innerHTML = `<div class="result bad"><strong>Seleziona un mese.</strong></div>`;
            return;
          }
          const info = monthInfo[select.value];
          state.month = info.label;
          state.monthNote = info.message;
          const riskLabel = info.risk === 'alto' ? 'attenzione alta' : 'attenzione media';
          out.innerHTML = `<div class="result ${info.risk === 'alto' ? 'warn' : ''}"><strong>${info.label} · ${info.season} · ${riskLabel}</strong><br>${info.message}</div>`;
          await addBot(`Segnato: <strong>${info.label}</strong>. Ora usiamo il calcolo per trasformare il mese in una decisione operativa.`);
          showOptions([{label:'Faccio il calcolo', next:'calc', primary:true}]);
        });
      });
    }

    function bindCalc(){
      document.querySelectorAll('.js-calc:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', async () => {
          const box = btn.closest('.js-calc-box');
          const base = parseFloat(box.querySelector('[data-field="base"]').value);
          const weeks = parseFloat(box.querySelector('[data-field="weeks"]').value);
          const budget = parseFloat(box.querySelector('[data-field="budget"]').value);
          const out = box.querySelector('.js-calc-result');
          if([base,weeks,budget].some(v => Number.isNaN(v) || v < 0)){
            out.innerHTML = `<div class="result bad"><strong>Compila tutti i campi con <span class="req">*</span>.</strong></div>`;
            return;
          }
          const monthBase = Math.round(base * weeks * 10) / 10;
          const gap = Math.round((monthBase - budget) * 10) / 10;
          let html, summary;
          if(gap > 0){
            summary = `base mese ${monthBase}h, budget ${budget}h, gap +${gap}h: valutare scarico ferie/ROL distribuito.`;
            html = `<div class="result"><strong>Base mese: ${monthBase}h.</strong><br>La base supera il budget di <strong>${gap}h</strong>.<br>Azione: valuta almeno ${gap}h di ferie/ROL, distribuite in modo equilibrato sulle settimane sostenibili.</div>`;
          } else if(gap < 0){
            summary = `base mese ${monthBase}h, budget ${budget}h, gap ${gap}h: scarico più soft e coperture da presidiare.`;
            html = `<div class="result warn"><strong>Base mese: ${monthBase}h.</strong><br>Il budget è superiore alla base di <strong>${Math.abs(gap)}h</strong>.<br>Azione: scarico ferie più prudente e valutazione di coperture, aumenti ore, temporaneità o assunzioni.</div>`;
          } else {
            summary = `base mese ${monthBase}h allineata al budget ${budget}h: verificare settimana per settimana.`;
            html = `<div class="result"><strong>Base mese: ${monthBase}h.</strong><br>Base e budget sono allineati.<br>Azione: controlla le settimane sensibili e il mix ruoli prima di approvare richieste.</div>`;
          }
          state.calc = {base,weeks,budget,monthBase,gap,summary};
          out.innerHTML = html;
          await addBot('Calcolo salvato nel promemoria. Ora facciamo due scenari lampo per verificare la lettura manageriale.');
          showOptions([{label:'Vai agli scenari', next:'scenarios', primary:true}]);
        });
      });
    }

    function bindGovernance(){
      document.querySelectorAll('.js-gov:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', async () => {
          const box = btn.closest('.js-gov-box');
          const total = box.querySelectorAll('input').length;
          const count = box.querySelectorAll('input:checked').length;
          state.governanceCount = count;
          const out = box.querySelector('.js-gov-result');
          if(count === total){
            out.innerHTML = `<div class="result"><strong>Chiusura completa:</strong> hai spuntato tutti i controlli.</div>`;
          } else {
            out.innerHTML = `<div class="result warn"><strong>${count}/${total} controlli selezionati.</strong> Mancano ancora ${total - count} passaggi di governance.</div>`;
          }
          await addBot(count === total ? 'Perfetto. Ti preparo il promemoria finale.' : 'Ti preparo comunque il promemoria, così vedi cosa completare prima della chiusura ufficiale.');
          showOptions([{label:'Apri promemoria finale', next:'summary', primary:true}]);
        });
      });
    }

    function escapeHtml(value){
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function downloadMemoText(text){
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'promemoria_piano_ferie_post_formazione.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 900);
    }

    async function copyText(text, box, successLabel){
      try{
        await navigator.clipboard.writeText(text);
        box.querySelector('.js-final-result').insertAdjacentHTML('afterbegin', `<div class="result">${successLabel}</div>`);
      } catch(e){
        box.querySelector('.js-final-result').insertAdjacentHTML('afterbegin', `<div class="result warn">Copia automatica non disponibile: seleziona il testo del promemoria e copialo manualmente.</div>`);
      }
    }

    function renderMemoPanel(box){
      const text = buildMemo();
      box.querySelector('.js-final-result').innerHTML = `
        <div class="result"><strong>Promemoria pronto.</strong> Ora è leggibile qui sotto: non dipende più dal download del telefono.</div>
        <textarea class="memo-text" readonly aria-label="Promemoria piano ferie">${escapeHtml(text)}</textarea>
        <div class="form-grid memo-actions">
          <button class="inline-btn js-copy-memo-panel">Copia promemoria</button>
          <button class="inline-btn secondary js-download-memo-panel">Scarica TXT</button>
        </div>`;
      const textarea = box.querySelector('.memo-text');
      textarea.addEventListener('focus', () => textarea.select());
      box.querySelector('.js-copy-memo-panel').addEventListener('click', () => copyText(text, box, 'Promemoria copiato.'));
      box.querySelector('.js-download-memo-panel').addEventListener('click', () => downloadMemoText(text));
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    function bindFinal(){
      document.querySelectorAll('.js-open-memo:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', () => {
          const box = btn.closest('.js-final-box');
          renderMemoPanel(box);
        });
      });
      document.querySelectorAll('.js-copy-memo:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', async () => {
          const box = btn.closest('.js-final-box');
          if(!box.querySelector('.memo-text')) renderMemoPanel(box);
          await copyText(buildMemo(), box, 'Promemoria copiato.');
        });
      });
      document.querySelectorAll('.js-copy-team:not([data-bound])').forEach(btn => {
        btn.dataset.bound = '1';
        btn.addEventListener('click', async () => {
          const box = btn.closest('.js-final-box');
          const msg = state.teamMessage || 'Entro la data indicata inviate le preferenze ferie/ROL, tenendo conto dei paletti condivisi: settimane sensibili, sostenibilità, rotazione ed equilibrio del team.';
          await copyText(msg, box, 'Messaggio al team copiato.');
        });
      });
    }

    function buildMemo(){
      return [
        'PROMEMORIA PIANO FERIE · POST FORMAZIONE',
        '',
        'Obiettivo: ' + (state.goal || 'non indicato'),
        'Ruolo: ' + (state.role || 'non indicato'),
        'Mese controllato: ' + (state.month || 'non indicato'),
        state.monthNote ? 'Nota mese: ' + state.monthNote : '',
        '',
        '1. Primo passo: aprire il file HR e creare la bozza.',
        '2. Dati obbligatori*: nome e cognome, codice dipendente, ruolo, base oraria, settimane ferie/ROL, weekend dove previsti.',
        '3. Strumenti*: file piano ferie, residuo H ferie/ROL, tabelle maturazione, calendario commerciale, indicazioni aziendali, CIA, moduli.',
        '4. Calcolo: ' + (state.calc ? state.calc.summary : 'non compilato'),
        '5. Regole*: periodo febbraio-gennaio, piani separati venditori/manager, no sovrapposizione responsabili, due settimane consecutive da giugno a settembre, coperture chiave.',
        '6. Team: comunicare paletti e scadenza prima di raccogliere le preferenze.',
        '7. Conflitti: ' + (state.conflictChoice || 'mediare, verificare anno precedente, procedere secondo indicazioni se manca accordo.'),
        '8. Chiusura*: file ufficiale, invio HR/DT, bacheca, moduli firmati e archiviati, no modifiche a penna, reminder manager.',
        '',
        'Messaggio team suggerito:',
        state.teamMessage || 'Entro la data indicata inviate le preferenze ferie/ROL, tenendo conto dei paletti condivisi: settimane sensibili, sostenibilità, rotazione ed equilibrio del team.',
        '',
        '* = informazione o azione obbligatoria.'
      ].filter(Boolean).join('\n');
    }

    goTo('intro');
  </script>
