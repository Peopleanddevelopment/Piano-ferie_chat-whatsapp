<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Piano ferie · Chat interattiva</title>
  <style>
    :root{
      --green:#075e54;
      --green-2:#128c7e;
      --green-3:#25d366;
      --bg:#efe7dd;
      --bubble:#ffffff;
      --bubble-me:#dcf8c6;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --danger:#d72638;
      --amber:#fff3cd;
      --amber-border:#ffdf7e;
      --shadow:0 24px 60px rgba(0,0,0,.28);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,211,102,.26), transparent 28rem),
        linear-gradient(135deg,#043c35 0%,#075e54 45%,#0b2f2a 100%);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }
    .phone{
      width:min(100%, 520px);
      height:min(94vh, 920px);
      background:var(--bg);
      border-radius:34px;
      box-shadow:var(--shadow);
      overflow:hidden;
      border:8px solid rgba(255,255,255,.14);
      display:flex;
      flex-direction:column;
      position:relative;
    }
    .wa-header{
      background:linear-gradient(90deg,var(--green),var(--green-2));
      color:#fff;
      padding:16px 16px 12px;
      display:grid;
      grid-template-columns:48px 1fr auto;
      gap:12px;
      align-items:center;
    }
    .avatar{
      width:44px;height:44px;border-radius:50%;
      background:#d9fdd3;
      color:var(--green);
      display:grid;place-items:center;
      font-weight:800;
      letter-spacing:.3px;
    }
    .title{font-weight:800;font-size:17px;line-height:1.1}
    .subtitle{font-size:12px;opacity:.86;margin-top:3px}
    .pill{
      border:1px solid rgba(255,255,255,.28);
      border-radius:999px;
      padding:6px 9px;
      font-size:11px;
      white-space:nowrap;
      background:rgba(255,255,255,.12);
    }
    .progress-wrap{grid-column:1/-1;height:6px;background:rgba(255,255,255,.24);border-radius:999px;overflow:hidden;margin-top:8px}
    .progress{height:100%;width:0%;background:var(--green-3);border-radius:999px;transition:width .4s ease}
    .chat{
      flex:1;
      overflow-y:auto;
      padding:18px 14px 92px;
      background:
        linear-gradient(rgba(239,231,221,.92), rgba(239,231,221,.92)),
        repeating-linear-gradient(45deg, transparent 0 18px, rgba(7,94,84,.035) 18px 19px);
      scroll-behavior:smooth;
    }
    .row{display:flex;margin:8px 0}
    .row.me{justify-content:flex-end}
    .bubble{
      max-width:87%;
      background:var(--bubble);
      border-radius:var(--radius);
      padding:12px 13px;
      box-shadow:0 1px 2px rgba(0,0,0,.1);
      font-size:15px;
      line-height:1.38;
      position:relative;
      overflow:hidden;
    }
    .row.me .bubble{background:var(--bubble-me)}
    .bubble p{margin:0 0 8px}
    .bubble p:last-child{margin-bottom:0}
    .bubble ul,.bubble ol{margin:8px 0 0 20px;padding:0}
    .bubble li{margin:5px 0}
    .mini-title{
      display:block;
      font-size:12px;
      color:var(--green);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:5px;
    }
    .stamp{
      display:block;
      font-size:10px;
      color:#81908b;
      text-align:right;
      margin-top:5px;
      user-select:none;
    }
    .star{color:var(--danger);font-weight:1000}
    .must{
      display:inline-flex;align-items:center;gap:5px;
      border:1px solid #ffc4cb;
      background:#fff1f3;
      color:#991b1b;
      border-radius:999px;
      padding:3px 8px;
      font-size:12px;
      font-weight:900;
      margin:2px 4px 2px 0;
    }
    .card{
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px;
      margin-top:8px;
      background:#fafafa;
    }
    .card.must-card{
      border-color:#ffc4cb;
      background:linear-gradient(180deg,#fff8f9,#ffffff);
    }
    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      margin-top:8px;
    }
    .field-list{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      margin-top:8px;
    }
    .field{
      border:1px solid #e5e7eb;
      border-radius:13px;
      background:#fff;
      padding:9px;
      font-weight:750;
      font-size:13px;
    }
    .note{
      background:var(--amber);
      border:1px solid var(--amber-border);
      border-radius:14px;
      padding:9px 10px;
      margin-top:8px;
      font-size:13px;
    }
    .typing{
      display:inline-flex;
      gap:4px;
      align-items:center;
      min-width:48px;
      justify-content:center;
    }
    .typing span{
      width:7px;height:7px;border-radius:50%;
      background:#8a8a8a;
      animation:bounce 1s infinite ease-in-out;
    }
    .typing span:nth-child(2){animation-delay:.12s}
    .typing span:nth-child(3){animation-delay:.24s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
    .options{
      position:absolute;
      left:0;right:0;bottom:0;
      padding:10px 12px 14px;
      background:linear-gradient(180deg,rgba(239,231,221,0),rgba(239,231,221,.98) 18%,rgba(239,231,221,1));
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    button{
      font:inherit;
      border:0;
      cursor:pointer;
    }
    .reply{
      background:#fff;
      border:1px solid rgba(7,94,84,.16);
      color:var(--green);
      border-radius:999px;
      padding:10px 14px;
      font-weight:800;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      transition:transform .15s ease, background .15s ease;
    }
    .reply:hover{transform:translateY(-1px);background:#f4fffb}
    .reply.primary{background:var(--green);color:#fff}
    .reply.good{background:#e8fff0;color:#066a34}
    .reply.warn{background:#fff7e6;color:#8a5200}
    .reply:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .calc label{
      display:block;
      font-weight:800;
      font-size:12px;
      margin:9px 0 4px;
    }
    .calc input{
      width:100%;
      border:1px solid #d1d5db;
      border-radius:12px;
      padding:10px;
      font:inherit;
      background:#fff;
      outline:none;
    }
    .calc input:focus{border-color:var(--green-2);box-shadow:0 0 0 3px rgba(18,140,126,.12)}
    .calc-btn,.small-btn{
      margin-top:10px;
      width:100%;
      border-radius:13px;
      padding:10px;
      background:var(--green);
      color:#fff;
      font-weight:900;
    }
    .small-btn.secondary{background:#f2f7f5;color:var(--green);border:1px solid #d6e8e2}
    .result{
      margin-top:10px;
      padding:10px;
      border-radius:13px;
      border:1px solid #d7efe5;
      background:#f1fff6;
      font-size:13px;
    }
    details{
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:9px 10px;
      background:#fff;
      margin:8px 0;
    }
    summary{
      cursor:pointer;
      font-weight:900;
      color:var(--green);
    }
    details p{margin:8px 0 0;font-size:13px;color:#374151}
    .todo{
      display:flex;
      gap:8px;
      align-items:flex-start;
      border:1px solid #e5e7eb;
      border-radius:13px;
      padding:9px;
      background:#fff;
      margin:7px 0;
      font-size:13px;
    }
    .todo input{accent-color:var(--green);margin-top:2px}
    .footer-hint{
      position:absolute;
      right:16px;
      bottom:76px;
      font-size:11px;
      color:#64706c;
      background:rgba(255,255,255,.76);
      border-radius:999px;
      padding:5px 8px;
      pointer-events:none;
    }
    .hide{display:none}
    @media (max-width:520px){
      body{padding:0}
      .phone{height:100vh;border:0;border-radius:0;width:100%}
      .bubble{max-width:91%}
      .field-list{grid-template-columns:1fr}
      .pill{display:none}
      .options{justify-content:center}
      .reply{flex:1 1 auto}
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Chat interattiva piano ferie">
    <header class="wa-header">
      <div class="avatar">PF</div>
      <div>
        <div class="title">Guida Piano Ferie</div>
        <div class="subtitle">chat semplice · percorso individuale</div>
      </div>
      <div class="pill" id="stepPill">0%</div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    </header>

    <section class="chat" id="chat" aria-live="polite"></section>
    <div class="footer-hint" id="hint">Le cose obbligatorie hanno <span class="star">*</span></div>
    <nav class="options" id="options" aria-label="Risposte rapide"></nav>
  </main>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const chat = $("#chat");
    const options = $("#options");
    const progress = $("#progress");
    const stepPill = $("#stepPill");

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    const steps = {
      intro: {
        progress: 0,
        bot: [
          `<span class="mini-title">Benvenuto/a</span>
           Questa chat ti guida in modo semplice sul <strong>piano ferie</strong>. Una cosa alla volta, senza slide lunghe.`,
          `Regola chiave: quando vedi <span class="star">*</span>, significa che quella informazione o quell'azione è <strong>obbligatoria</strong>.`,
          `<strong>Prima cosa da fare?</strong><br>Capire l'ordine: non si parte dalle richieste del team, si parte dalla <strong>bozza</strong> e dai <strong>dati</strong>.`
        ],
        options: [{ label: "Inizia", next: "valore", primary: true }]
      },

      valore: {
        progress: 10,
        bot: [
          `<span class="mini-title">1 · Perché parliamo di ferie?</span>
           Le ferie non sono solo assenza dal lavoro: sono un diritto e servono a recuperare energie, tempo personale e serenità.`,
          `I <strong>ROL</strong> sono permessi retribuiti in ore. Sono più flessibili e aiutano a gestire esigenze personali o organizzative.`,
          `<div class="note"><strong>Idea semplice:</strong> un buon piano ferie tiene insieme benessere delle persone e funzionamento del negozio.</div>`
        ],
        options: [{ label: "Ok, qual è il primo passo pratico?", next: "primo", primary: true }]
      },

      primo: {
        progress: 22,
        bot: [
          `<span class="mini-title">2 · Primo passo pratico</span>
           <strong>Apri il file piano ferie ricevuto da HR e crea una bozza di lavoro.</strong>`,
          `Sulla bozza devi già avere le informazioni base. Quelle obbligatorie sono segnate con <span class="star">*</span>.`,
          `<div class="card must-card">
             <strong>Da scrivere nella bozza</strong>
             <div class="field-list">
               <div class="field"><span class="star">*</span> Nome e cognome</div>
               <div class="field"><span class="star">*</span> Codice dipendente</div>
               <div class="field"><span class="star">*</span> Ruolo</div>
               <div class="field"><span class="star">*</span> Base oraria</div>
               <div class="field"><span class="star">*</span> Settimane ferie/ROL</div>
               <div class="field"><span class="star">*</span> Weekend scelti se previsti</div>
             </div>
           </div>`,
          `Prima di chiedere preferenze al team, devi sapere quante ferie/ROL sono sostenibili settimana per settimana.`
        ],
        options: [
          { label: "Mostrami gli strumenti", next: "strumenti", primary: true },
          { label: "Fammi un esempio breve", action: "examplePrimo" }
        ]
      },

      strumenti: {
        progress: 34,
        bot: [
          `<span class="mini-title">3 · Strumenti da recuperare</span>
           Ti servono pochi documenti, ma quelli giusti.`,
          `<div class="card must-card">
             <span class="must"><span class="star">*</span> obbligatori</span>
             <ul>
               <li><strong>File piano ferie</strong></li>
               <li><strong>File residuo H ferie/ROL</strong></li>
               <li><strong>Tabelle maturazione ferie/ROL</strong></li>
               <li><strong>Indicazioni aziendali dell'anno</strong></li>
               <li><strong>Calendario commerciale</strong>: saldi, Natale, Pasqua, Black Friday</li>
               <li><strong>CIA</strong> e riferimenti aziendali</li>
               <li><strong>Modulo richiesta ferie/ROL</strong>, da usare dopo la convalida</li>
               <li><strong>Modello disponibilità</strong>, per aumenti ore temporanei</li>
             </ul>
           </div>`,
          `<strong>Mini domanda:</strong> quale strumento ti dice il saldo ferie/ROL del team?`
        ],
        options: [
          { label: "File residuo H ferie/ROL", feedback: "Esatto. Ti serve per capire quante settimane/ore ciascuna persona può pianificare.", next: "regole", good: true },
          { label: "Modulo richiesta ferie/ROL", feedback: "Quasi. Il modulo serve dopo la convalida del piano; per il saldo devi usare il file residuo H ferie/ROL.", next: "regole", warn: true }
        ]
      },

      regole: {
        progress: 48,
        bot: [
          `<span class="mini-title">4 · Regole da non perdere</span>
           Qui devi solo ricordare i paletti principali.`,
          `<div class="card must-card">
             <ul>
               <li><span class="star">*</span> Il periodo commerciale da considerare è <strong>febbraio-gennaio</strong>.</li>
               <li><span class="star">*</span> Prepara <strong>due piani distinti</strong>: venditori e manager.</li>
               <li><span class="star">*</span> Evita sovrapposizioni tra responsabili.</li>
               <li><span class="star">*</span> Da giugno a settembre ogni dipendente deve godere di <strong>due settimane consecutive</strong>.</li>
               <li><span class="star">*</span> Garantisci funzionalità cassa e alternanza aperture/chiusure.</li>
               <li><span class="star">*</span> Inserisci weekend e disponibilità festivi se previsto dal CIA.</li>
             </ul>
           </div>`,
          `<div class="note"><strong>Da monitorare:</strong> partenza saldi, Natale, Pasqua, Black Friday e settimane con operative intense.</div>`
        ],
        options: [{ label: "Ora faccio il calcolo", next: "calcolo", primary: true }]
      },

      calcolo: {
        progress: 61,
        bot: [
          `<span class="mini-title">5 · Calcolo rapido</span>
           Ora capisci quante ore puoi scaricare con ferie/ROL.`,
          `Formula semplice:<br><strong>base incomprimibile settimanale × settimane del mese = base incomprimibile mese</strong>.`,
          `<div class="card calc">
             <strong>Prova il calcolo</strong>
             <label><span class="star">*</span> Base incomprimibile settimanale</label>
             <input id="baseOre" inputmode="decimal" type="number" min="0" placeholder="es. 300">
             <label><span class="star">*</span> Settimane del mese</label>
             <input id="settimane" inputmode="decimal" type="number" min="0" step="0.1" placeholder="es. 4 oppure 4.2">
             <label><span class="star">*</span> Budget ore mese</label>
             <input id="budgetOre" inputmode="decimal" type="number" min="0" placeholder="es. 1000">
             <button class="calc-btn" id="calcBtn">Calcola</button>
             <div id="calcResult"></div>
           </div>`,
          `Dopo il calcolo saprai se prevedere più scarico ferie/ROL o se tenerti più prudente.`
        ],
        after: "calc",
        options: [{ label: "Prosegui", next: "paletti", primary: true }]
      },

      paletti: {
        progress: 72,
        bot: [
          `<span class="mini-title">6 · Fissa i paletti nella bozza</span>
           Solo dopo dati e calcolo puoi dare indicazioni al team.`,
          `<div class="card must-card">
             <strong>Da definire prima di raccogliere le preferenze</strong>
             <ul>
               <li><span class="star">*</span> Quante ore/persone possono essere in ferie o ROL per settimana.</li>
               <li><span class="star">*</span> Quante settimane ogni persona deve pianificare.</li>
               <li><span class="star">*</span> Quali settimane sono da attenzionare.</li>
               <li><span class="star">*</span> Entro quando il team deve inviare le preferenze.</li>
             </ul>
           </div>`,
          `<strong>Mini domanda:</strong> cosa comunichi al team quando chiedi le preferenze?`
        ],
        options: [
          { label: "Paletti + scadenza", feedback: "Corretto. In questo modo le richieste arrivano già dentro un perimetro chiaro.", next: "verifica", good: true },
          { label: "Solo: scegliete le ferie", feedback: "Meglio evitare. Senza paletti rischi richieste non sostenibili e molte modifiche dopo.", next: "verifica", warn: true }
        ]
      },

      verifica: {
        progress: 83,
        bot: [
          `<span class="mini-title">7 · Raccogli, controlla, sistema</span>
           Dopo aver raccolto le richieste, fai i controlli.`,
          `<div class="card">
             <ul>
               <li>Le indicazioni aziendali sono rispettate?</li>
               <li>Ogni settimana è sostenibile in ore?</li>
               <li>I ruoli sono ben bilanciati?</li>
               <li>Ci sono sovrapposizioni critiche?</li>
               <li>Il piano è equo rispetto al team?</li>
             </ul>
           </div>`,
          `Se ci sono richieste sovrapposte, prova prima a mediare. Se manca l'accordo, confronta la fruizione dell'anno precedente e, se necessario, procedi secondo le indicazioni aziendali.`
        ],
        options: [{ label: "Come chiudo il piano?", next: "chiusura", primary: true }]
      },

      chiusura: {
        progress: 93,
        bot: [
          `<span class="mini-title">8 · Chiusura obbligatoria</span>
           Quando il piano è pronto, questa è la parte da non dimenticare.`,
          `<div class="card must-card">
             <span class="must"><span class="star">*</span> obbligatorio</span>
             <ul>
               <li>Riporta tutti i dati nel file ufficiale.</li>
               <li>Invia il file a <strong>DT e HR</strong> entro la data indicata.</li>
               <li>Stampa il piano, fallo vidimare con timbro/firma e affiggilo in bacheca.</li>
               <li>Fai compilare e firmare i moduli ferie/ROL.</li>
               <li>Archivia i moduli e consegna copia al dipendente.</li>
               <li>Fai compilare il modello disponibilità a chi è interessato ad aumenti ore temporanei.</li>
               <li>Una settimana prima del godimento, il responsabile invia mail a DT e HR per ricordare le proprie ferie/ROL.</li>
             </ul>
           </div>`,
          `<div class="note"><strong>Attenzione:</strong> dopo l'esposizione in bacheca, niente modifiche a penna. La modifica deve essere fatta sul file.</div>`
        ],
        options: [{ label: "Fammi il riepilogo finale", next: "riepilogo", primary: true }]
      },

      riepilogo: {
        progress: 100,
        bot: [
          `<span class="mini-title">Riepilogo in 6 mosse</span>
           <div class="card">
             <ol>
               <li>Apri il file HR e crea la bozza.</li>
               <li>Inserisci i dati obbligatori <span class="star">*</span>.</li>
               <li>Recupera residui, tabelle, indicazioni e calendario.</li>
               <li>Calcola base incomprimibile vs budget.</li>
               <li>Chiedi preferenze con paletti e scadenza <span class="star">*</span>.</li>
               <li>Verifica, invia, esponi, fai firmare e archivia <span class="star">*</span>.</li>
             </ol>
           </div>`,
          `<div class="card must-card">
             <strong>Checklist personale</strong>
             <label class="todo"><input type="checkbox"> Ho capito cosa devo fare per primo: file HR + bozza.</label>
             <label class="todo"><input type="checkbox"> So quali campi obbligatori scrivere.</label>
             <label class="todo"><input type="checkbox"> So usare il calcolo base incomprimibile vs budget.</label>
             <label class="todo"><input type="checkbox"> So cosa chiudere, inviare, firmare e archiviare.</label>
             <button class="small-btn" id="downloadMemo">Scarica promemoria</button>
           </div>`,
          `Ultima cosa: ho preparato il <strong>glossario</strong>, così puoi rivedere le parole chiave.`
        ],
        after: "memo",
        options: [{ label: "Apri glossario", next: "glossario", primary: true }]
      },

      glossario: {
        progress: 100,
        bot: [
          `<span class="mini-title">Glossario finale</span>
           <details open>
             <summary>Ferie</summary>
             <p>Periodo di riposo retribuito. Non è un premio: serve a recuperare energie e a tutelare il benessere della persona.</p>
           </details>
           <details>
             <summary>ROL</summary>
             <p>Riduzione Orario di Lavoro. Permessi retribuiti, gestiti in ore, utili per esigenze personali o organizzative.</p>
           </details>
           <details>
             <summary>Piano ferie</summary>
             <p>Documento aziendale che organizza ferie e ROL del team, conciliando richieste personali ed esigenze del negozio.</p>
           </details>
           <details>
             <summary>Base incomprimibile</summary>
             <p>Somma delle basi contrattuali fisse presenti in store. Serve per capire la copertura minima mese per mese.</p>
           </details>
           <details>
             <summary>Budget ore</summary>
             <p>Monte ore assegnato al negozio per un periodo. Va confrontato con la base incomprimibile.</p>
           </details>
           <details>
             <summary>Scarico ferie/ROL</summary>
             <p>Ore di ferie o ROL pianificate per alleggerire la presenza in un periodo, mantenendo equilibrio e copertura.</p>
           </details>
           <details>
             <summary>Residuo ferie/ROL</summary>
             <p>Saldo aggiornato delle ore ancora disponibili per ciascuna persona.</p>
           </details>
           <details>
             <summary>CIA</summary>
             <p>Contratto Integrativo Aziendale. Integra le regole di riferimento su ferie, ROL, weekend e disponibilità festivi.</p>
           </details>
           <details>
             <summary>DT e HR</summary>
             <p>Figure/funzioni a cui inviare il piano per presa visione e supporto.</p>
           </details>`
        ],
        options: [
          { label: "Ricomincia", next: "intro" },
          { label: "Rivedi il primo passo", next: "primo", primary: true }
        ]
      }
    };

    let activeStep = "intro";
    let busy = false;

    function now(){
      return new Date().toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});
    }

    function updateProgress(value){
      progress.style.width = `${value}%`;
      stepPill.textContent = `${value}%`;
    }

    function clearOptions(){
      options.innerHTML = "";
    }

    function showOptions(items){
      clearOptions();
      items.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "reply" + (item.primary ? " primary" : "") + (item.good ? " good" : "") + (item.warn ? " warn" : "");
        btn.textContent = item.label;
        btn.addEventListener("click", () => handleOption(item));
        options.appendChild(btn);
      });
    }

    function addMessage(html, who="bot"){
      const row = document.createElement("div");
      row.className = `row ${who === "me" ? "me" : ""}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `${html}<span class="stamp">${now()}</span>`;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    async function addBot(html, delay=520){
      const row = addMessage(`<span class="typing"><span></span><span></span><span></span></span>`, "bot");
      await sleep(delay);
      row.querySelector(".bubble").innerHTML = `${html}<span class="stamp">${now()}</span>`;
      chat.scrollTop = chat.scrollHeight;
    }

    function addUser(text){
      addMessage(text, "me");
    }

    async function goToStep(id){
      if(!steps[id]) return;
      busy = true;
      clearOptions();
      activeStep = id;
      const step = steps[id];
      updateProgress(step.progress);
      for(const msg of step.bot){
        await addBot(msg);
        await sleep(130);
      }
      if(step.after) runAfter(step.after);
      showOptions(step.options || []);
      busy = false;
    }

    async function handleOption(item){
      if(busy) return;
      addUser(item.label);
      clearOptions();

      if(item.action === "examplePrimo"){
        await addBot(`Esempio semplice: se prima chiedi al team le ferie, rischi 5 persone sulla stessa settimana. Se prima fai la bozza, sai già quante persone/ore puoi sostenere.`);
        showOptions([{ label: "Ok, ora gli strumenti", next: "strumenti", primary: true }]);
        return;
      }

      if(item.feedback){
        await addBot(item.feedback);
      }

      if(item.next){
        await sleep(180);
        goToStep(item.next);
      }
    }

    function runAfter(type){
      if(type === "calc") attachCalculator();
      if(type === "memo") attachMemo();
    }

    function attachCalculator(){
      setTimeout(() => {
        const btn = $("#calcBtn");
        if(!btn) return;
        btn.addEventListener("click", () => {
          const base = parseFloat($("#baseOre").value);
          const settimane = parseFloat($("#settimane").value);
          const budget = parseFloat($("#budgetOre").value);
          const out = $("#calcResult");

          if([base,settimane,budget].some(v => Number.isNaN(v) || v < 0)){
            out.innerHTML = `<div class="result" style="border-color:#ffc4cb;background:#fff1f3;"><strong>Compila tutti i campi con <span class="star">*</span>.</strong></div>`;
            return;
          }

          const mese = base * settimane;
          const diff = mese - budget;
          const roundedMese = Math.round(mese * 10) / 10;
          const roundedDiff = Math.round(Math.abs(diff) * 10) / 10;

          let msg = "";
          if(diff > 0){
            msg = `<strong>Base incomprimibile mese: ${roundedMese} h.</strong><br>
                   La base supera il budget di <strong>${roundedDiff} h</strong>.<br>
                   Valuta uno scarico ferie/ROL almeno pari al gap, distribuendolo sulle settimane in modo equilibrato.`;
          } else if(diff < 0){
            msg = `<strong>Base incomprimibile mese: ${roundedMese} h.</strong><br>
                   Hai un margine di <strong>${roundedDiff} h</strong> rispetto al budget.<br>
                   In questo caso lo scarico ferie/ROL va valutato con più prudenza, tenendo conto di vendite e operative.`;
          } else {
            msg = `<strong>Base incomprimibile mese: ${roundedMese} h.</strong><br>
                   Base e budget sono allineati. Valuta le ferie settimana per settimana, senza creare scoperture.`;
          }
          out.innerHTML = `<div class="result">${msg}</div>`;
        });
      }, 0);
    }

    function attachMemo(){
      setTimeout(() => {
        const btn = $("#downloadMemo");
        if(!btn) return;
        btn.addEventListener("click", () => {
          const text = [
            "PROMEMORIA PIANO FERIE",
            "",
            "1. Primo passo: apri il file HR e crea la bozza.",
            "2. Dati obbligatori*: nome e cognome, codice dipendente, ruolo, base oraria, settimane ferie/ROL, weekend se previsti.",
            "3. Recupera strumenti*: residui ferie/ROL, tabelle maturazione, calendario commerciale, indicazioni aziendali, CIA.",
            "4. Calcola: base incomprimibile settimanale x settimane del mese, poi confronta con budget ore.",
            "5. Chiedi preferenze al team solo dopo aver fissato paletti e scadenza.",
            "6. Verifica sostenibilità, equilibrio, ruoli e sovrapposizioni.",
            "7. Chiusura obbligatoria*: invio a DT/HR, bacheca, moduli firmati, archiviazione e copie.",
            "",
            "* = informazione o azione obbligatoria."
          ].join("\\n");
          const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "promemoria_piano_ferie.txt";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        });
      }, 0);
    }

    goToStep("intro");
  </script>
</body>
</html>
